<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style><![CDATA[
      .entity { fill:#ffffff; stroke:#111827; stroke-width:2; rx:8; ry:8; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.1)); }
      .entity-label { font: 700 16px/1 'Inter', sans-serif; fill:#FF6B35; }
      .weak-entity { fill:#f9fafb; stroke:#6b7280; stroke-width:2; stroke-dasharray:5,5; rx:8; ry:8; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.1)); }
      .attr { fill:#fff; stroke:#6b7280; stroke-width:1.5; rx:50%; ry:50%; }
      .attr-label { font: 500 12px/1 'Inter', sans-serif; fill:#1f2937; }
      .pk { font-weight:700; fill:#0f5132; }
      .fk { font-weight:600; fill:#92400e; font-style:italic; }
      .rel { fill:#FFF7ED; stroke:#4CAF50; stroke-width:2; }
      .rel-label { font: 600 13px/1 'Inter', sans-serif; fill:#065f46; }
      .connector { stroke:#374151; stroke-width:1.5; fill:none; }
      .card { font: 600 11px/1 'Inter', sans-serif; fill:#374151; }
    ]]></style>
  </defs>

  <!-- Entities -->

  <!-- Customer (top-left) -->
  <g id="customer">
    <rect class="entity" x="50" y="100" width="200" height="100"/>
    <text class="entity-label" x="150" y="125" text-anchor="middle">Customer</text>
    <ellipse class="attr" cx="150" cy="70" rx="65" ry="20"/>
    <text class="attr-label pk" x="150" y="74" text-anchor="middle">CustomerID (PK)</text>
    <ellipse class="attr" cx="150" cy="160" rx="70" ry="20"/>
    <text class="attr-label" x="150" y="164" text-anchor="middle">CustomerName</text>
    <line class="connector" x1="150" y1="90" x2="150" y2="100"/>
    <line class="connector" x1="150" y1="140" x2="150" y2="140"/>
  </g>

  <!-- CustomerPhone (weak entity, below Customer) -->
  <g id="customerphone">
    <rect class="weak-entity" x="50" y="250" width="200" height="80"/>
    <text class="entity-label" x="150" y="275" text-anchor="middle">CustomerPhone</text>
    <ellipse class="attr" cx="150" cy="210" rx="75" ry="20"/>
    <text class="attr-label fk" x="150" y="214" text-anchor="middle">CustomerID (FK)</text>
    <ellipse class="attr" cx="150" cy="320" rx="80" ry="20"/>
    <text class="attr-label pk" x="150" y="324" text-anchor="middle">PhoneNumber (PK)</text>
    <line class="connector" x1="150" y1="230" x2="150" y2="250"/>
    <line class="connector" x1="150" y1="300" x2="150" y2="290"/>
  </g>

  <!-- Orders (center) -->
  <g id="orders">
    <rect class="entity" x="600" y="150" width="250" height="150"/>
    <text class="entity-label" x="725" y="175" text-anchor="middle">Orders</text>
    <ellipse class="attr" cx="725" cy="120" rx="70" ry="20"/>
    <text class="attr-label pk" x="725" y="124" text-anchor="middle">OrderID (PK)</text>
    <ellipse class="attr" cx="550" cy="200" rx="65" ry="20"/>
    <text class="attr-label fk" x="550" y="204" text-anchor="middle">CustomerID (FK)</text>
    <ellipse class="attr" cx="725" cy="200" rx="75" ry="20"/>
    <text class="attr-label fk" x="725" y="204" text-anchor="middle">RestaurantID (FK)</text>
    <ellipse class="attr" cx="900" cy="200" rx="65" ry="20"/>
    <text class="attr-label fk" x="900" y="204" text-anchor="middle">RiderID (FK)</text>
    <ellipse class="attr" cx="650" cy="280" rx="60" ry="20"/>
    <text class="attr-label" x="650" y="284" text-anchor="middle">OrderDate</text>
    <ellipse class="attr" cx="800" cy="280" rx="70" ry="20"/>
    <text class="attr-label" x="800" y="284" text-anchor="middle">TotalAmount</text>
    <line class="connector" x1="725" y1="140" x2="725" y2="150"/>
    <line class="connector" x1="600" y1="200" x2="600" y2="200"/>
    <line class="connector" x1="725" y1="180" x2="725" y2="180"/>
    <line class="connector" x1="850" y1="200" x2="850" y2="200"/>
    <line class="connector" x1="650" y1="260" x2="650" y2="250"/>
    <line class="connector" x1="800" y1="260" x2="800" y2="250"/>
  </g>

  <!-- OrderFood (junction table, below Orders) -->
  <g id="orderfood">
    <rect class="entity" x="600" y="350" width="250" height="100"/>
    <text class="entity-label" x="725" y="375" text-anchor="middle">OrderFood</text>
    <ellipse class="attr" cx="650" cy="320" rx="65" ry="20"/>
    <text class="attr-label fk pk" x="650" y="324" text-anchor="middle">OrderID (FK,PK)</text>
    <ellipse class="attr" cx="800" cy="320" rx="65" ry="20"/>
    <text class="attr-label fk pk" x="800" y="324" text-anchor="middle">FoodID (FK,PK)</text>
    <ellipse class="attr" cx="725" cy="430" rx="55" ry="20"/>
    <text class="attr-label" x="725" y="434" text-anchor="middle">Quantity</text>
    <line class="connector" x1="650" y1="340" x2="650" y2="350"/>
    <line class="connector" x1="800" y1="340" x2="800" y2="350"/>
    <line class="connector" x1="725" y1="410" x2="725" y2="400"/>
  </g>

  <!-- Food (right of OrderFood) -->
  <g id="food">
    <rect class="entity" x="1000" y="350" width="200" height="120"/>
    <text class="entity-label" x="1100" y="375" text-anchor="middle">Food</text>
    <ellipse class="attr" cx="1100" cy="320" rx="60" ry="20"/>
    <text class="attr-label pk" x="1100" y="324" text-anchor="middle">FoodID (PK)</text>
    <ellipse class="attr" cx="1000" cy="400" rx="65" ry="20"/>
    <text class="attr-label" x="1000" y="404" text-anchor="middle">FoodName</text>
    <ellipse class="attr" cx="1100" cy="400" rx="70" ry="20"/>
    <text class="attr-label" x="1100" y="404" text-anchor="middle">Description</text>
    <ellipse class="attr" cx="1200" cy="400" rx="50" ry="20"/>
    <text class="attr-label" x="1200" y="404" text-anchor="middle">Price</text>
    <line class="connector" x1="1100" y1="340" x2="1100" y2="350"/>
    <line class="connector" x1="1000" y1="380" x2="1000" y2="380"/>
    <line class="connector" x1="1100" y1="380" x2="1100" y2="380"/>
    <line class="connector" x1="1200" y1="380" x2="1200" y2="380"/>
  </g>

  <!-- Restaurant (top-right) -->
  <g id="restaurant">
    <rect class="entity" x="1000" y="50" width="220" height="120"/>
    <text class="entity-label" x="1110" y="75" text-anchor="middle">Restaurant</text>
    <ellipse class="attr" cx="1110" cy="25" rx="70" ry="20"/>
    <text class="attr-label pk" x="1110" y="29" text-anchor="middle">RestaurantID (PK)</text>
    <ellipse class="attr" cx="1000" cy="110" rx="70" ry="20"/>
    <text class="attr-label" x="1000" y="114" text-anchor="middle">RestaurantName</text>
    <ellipse class="attr" cx="1110" cy="110" rx="60" ry="20"/>
    <text class="attr-label" x="1110" y="114" text-anchor="middle">Location</text>
    <ellipse class="attr" cx="1220" cy="110" rx="75" ry="20"/>
    <text class="attr-label" x="1220" y="114" text-anchor="middle">ContactNumber</text>
    <line class="connector" x1="1110" y1="45" x2="1110" y2="50"/>
    <line class="connector" x1="1000" y1="90" x2="1000" y2="90"/>
    <line class="connector" x1="1110" y1="90" x2="1110" y2="90"/>
    <line class="connector" x1="1220" y1="90" x2="1220" y2="90"/>
  </g>

  <!-- Rider (bottom-right) -->
  <g id="rider">
    <rect class="entity" x="1000" y="550" width="220" height="120"/>
    <text class="entity-label" x="1110" y="575" text-anchor="middle">Rider</text>
    <ellipse class="attr" cx="1110" cy="525" rx="60" ry="20"/>
    <text class="attr-label pk" x="1110" y="529" text-anchor="middle">RiderID (PK)</text>
    <ellipse class="attr" cx="1000" cy="600" rx="65" ry="20"/>
    <text class="attr-label" x="1000" y="604" text-anchor="middle">RiderName</text>
    <ellipse class="attr" cx="1110" cy="600" rx="75" ry="20"/>
    <text class="attr-label" x="1110" y="604" text-anchor="middle">ContactNumber</text>
    <ellipse class="attr" cx="1220" cy="600" rx="70" ry="20"/>
    <text class="attr-label" x="1220" y="604" text-anchor="middle">VehicleType</text>
    <line class="connector" x1="1110" y1="545" x2="1110" y2="550"/>
    <line class="connector" x1="1000" y1="580" x2="1000" y2="580"/>
    <line class="connector" x1="1110" y1="580" x2="1110" y2="580"/>
    <line class="connector" x1="1220" y1="580" x2="1220" y2="580"/>
  </g>

  <!-- Payment (right of Orders) -->
  <g id="payment">
    <rect class="entity" x="950" y="150" width="200" height="120"/>
    <text class="entity-label" x="1050" y="175" text-anchor="middle">Payment</text>
    <ellipse class="attr" cx="1050" cy="125" rx="65" ry="20"/>
    <text class="attr-label pk" x="1050" y="129" text-anchor="middle">PaymentID (PK)</text>
    <ellipse class="attr" cx="950" cy="200" rx="65" ry="20"/>
    <text class="attr-label fk" x="950" y="204" text-anchor="middle">OrderID (FK)</text>
    <ellipse class="attr" cx="1050" cy="200" rx="75" ry="20"/>
    <text class="attr-label" x="1050" y="204" text-anchor="middle">PaymentMethod</text>
    <ellipse class="attr" cx="1150" cy="200" rx="55" ry="20"/>
    <text class="attr-label" x="1150" y="204" text-anchor="middle">Amount</text>
    <ellipse class="attr" cx="1050" cy="250" rx="65" ry="20"/>
    <text class="attr-label" x="1050" y="254" text-anchor="middle">PaymentDate</text>
    <line class="connector" x1="1050" y1="145" x2="1050" y2="150"/>
    <line class="connector" x1="950" y1="180" x2="950" y2="180"/>
    <line class="connector" x1="1050" y1="180" x2="1050" y2="180"/>
    <line class="connector" x1="1150" y1="180" x2="1150" y2="180"/>
    <line class="connector" x1="1050" y1="230" x2="1050" y2="220"/>
  </g>

  <!-- Relationships -->

  <!-- Customer - CustomerPhone (has) -->
  <g id="rel_customer_phone">
    <polygon class="rel" points="250,200 270,185 290,200 270,215"/>
    <text class="rel-label" x="270" y="203" text-anchor="middle">has</text>
    <line class="connector" x1="250" y1="200" x2="250" y2="250"/>
    <line class="connector" x1="290" y1="200" x2="250" y2="330"/>
    <text class="card" x="220" y="190">1</text>
    <text class="card" x="220" y="340">M</text>
  </g>

  <!-- Customer - Orders (places) -->
  <g id="rel_customer_orders">
    <polygon class="rel" points="450,150 470,135 490,150 470,165"/>
    <text class="rel-label" x="470" y="153" text-anchor="middle">places</text>
    <line class="connector" x1="450" y1="150" x2="600" y2="150" marker-end="url(#arrow)"/>
    <line class="connector" x1="490" y1="150" x2="470" y2="200" marker-end="url(#arrow)"/>
    <text class="card" x="420" y="135">1</text>
    <text class="card" x="520" y="135">M</text>
  </g>

  <!-- Orders - Restaurant (fulfilled by) -->
  <g id="rel_orders_restaurant">
    <polygon class="rel" points="850,100 870,85 890,100 870,115"/>
    <text class="rel-label" x="870" y="103" text-anchor="middle">fulfilled by</text>
    <line class="connector" x1="850" y1="100" x2="1000" y2="100" marker-end="url(#arrow)"/>
    <line class="connector" x1="890" y1="100" x2="870" y2="150" marker-end="url(#arrow)"/>
    <text class="card" x="820" y="85">M</text>
    <text class="card" x="920" y="85">1</text>
  </g>

  <!-- Orders - Rider (delivered by) -->
  <g id="rel_orders_rider">
    <polygon class="rel" points="870,320 890,305 910,320 890,335"/>
    <text class="rel-label" x="890" y="323" text-anchor="middle">delivered by</text>
    <line class="connector" x1="870" y1="320" x2="890" y2="400" marker-end="url(#arrow)"/>
    <line class="connector" x1="910" y1="320" x2="1000" y2="550" marker-end="url(#arrow)"/>
    <text class="card" x="840" y="305">M</text>
    <text class="card" x="940" y="380">1</text>
  </g>

  <!-- Orders - OrderFood (contains) -->
  <g id="rel_orders_orderfood">
    <polygon class="rel" points="725,310 745,295 765,310 745,325"/>
    <text class="rel-label" x="745" y="313" text-anchor="middle">contains</text>
    <line class="connector" x1="725" y1="300" x2="725" y2="350"/>
    <line class="connector" x1="725" y1="310" x2="725" y2="310"/>
    <text class="card" x="695" y="295">1</text>
    <text class="card" x="795" y="295">M</text>
  </g>

  <!-- OrderFood - Food (includes) -->
  <g id="rel_orderfood_food">
    <polygon class="rel" points="900,380 920,365 940,380 920,395"/>
    <text class="rel-label" x="920" y="383" text-anchor="middle">includes</text>
    <line class="connector" x1="900" y1="380" x2="1000" y2="380" marker-end="url(#arrow)"/>
    <line class="connector" x1="940" y1="380" x2="920" y2="410" marker-end="url(#arrow)"/>
    <text class="card" x="870" y="365">M</text>
    <text class="card" x="970" y="365">1</text>
  </g>

  <!-- Orders - Payment (paid by) -->
  <g id="rel_orders_payment">
    <polygon class="rel" points="850,200 870,185 890,200 870,215"/>
    <text class="rel-label" x="870" y="203" text-anchor="middle">paid by</text>
    <line class="connector" x1="850" y1="200" x2="950" y2="200" marker-end="url(#arrow)"/>
    <line class="connector" x1="890" y1="200" x2="870" y2="220" marker-end="url(#arrow)"/>
    <text class="card" x="820" y="185">1</text>
    <text class="card" x="920" y="185">1</text>
  </g>

  <!-- Title -->
  <text x="800" y="30" text-anchor="middle" font-family="Space Grotesk, Inter" font-size="24" fill="#111827" font-weight="700">Entity-Relationship Diagram</text>
  <text x="800" y="55" text-anchor="middle" font-family="Inter" font-size="16" fill="#6b7280">Food Delivery Management System</text>

  <!-- Legend -->
  <rect x="1300" y="50" width="280" height="200" rx="8" ry="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="1320" y="75" font-family="Inter" font-size="14" fill="#374151" font-weight="700">Legend</text>
  <rect x="1320" y="85" width="20" height="20" fill="#ffffff" stroke="#111827" stroke-width="2" rx="2"/>
  <text x="1350" y="98" font-family="Inter" font-size="12" fill="#374151">Entity (Strong)</text>
  <rect x="1320" y="105" width="20" height="20" fill="#f9fafb" stroke="#6b7280" stroke-width="2" stroke-dasharray="3,3" rx="2"/>
  <text x="1350" y="118" font-family="Inter" font-size="12" fill="#374151">Entity (Weak)</text>
  <ellipse cx="1330" cy="135" rx="10" ry="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="1350" y="140" font-family="Inter" font-size="12" fill="#374151">Attribute</text>
  <polygon points="1320,145 1330,155 1340,145" fill="#FFF7ED" stroke="#4CAF50" stroke-width="2"/>
  <text x="1350" y="158" font-family="Inter" font-size="12" fill="#374151">Relationship</text>
  <text x="1320" y="175" font-family="Inter" font-size="11" fill="#0f5132" font-weight="700">PK = Primary Key</text>
  <text x="1320" y="190" font-family="Inter" font-size="11" fill="#92400e" font-style="italic">FK = Foreign Key</text>
</svg>