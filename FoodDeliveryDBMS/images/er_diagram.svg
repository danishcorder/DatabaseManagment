<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#374151"/>
    </marker>
    <style><![CDATA[
      /* Palette & typography */
      .entity { fill: rgba(255,255,255,0.98); stroke:#FF6B35; stroke-width:2; rx:10; ry:10; filter: drop-shadow(0 8px 20px rgba(0,0,0,0.08)); }
      .entity-title { font: 700 18px/1 'Inter', sans-serif; fill:#FF6B35; }
      .attr { fill:#fff; stroke:#4CAF50; stroke-width:1.6; }
      .attr-text { font: 500 13px/1 'Inter', sans-serif; fill:#1f2937; }
      .rel { fill:#fff7ed; stroke:#E85D75; stroke-width:1.6; }
      .rel-text { font: 600 13px/1 'Inter', sans-serif; fill:#9b2c2c; }
      .connector { stroke:#374151; stroke-width:1.2; fill:none; marker-end:url(#arrow); }
      .card { font: 600 12px/1 'Inter', sans-serif; fill:#374151; }
      .pk { font-weight:700; fill:#0f5132; }
      .note { font: 500 12px/1 'Inter', sans-serif; fill:#374151; }
    ]]></style>
  </defs>

  <!-- Title -->
  <text x="700" y="36" text-anchor="middle" font-family="Space Grotesk, Inter" font-size="20" fill="#111827" font-weight="700">ER Diagram — Food Delivery Management System</text>

  <!-- CUSTOMER (left) -->
  <g id="customer">
    <rect class="entity" x="60" y="100" width="260" height="110" rx="10" ry="10"/>
    <text class="entity-title" x="190" y="140" text-anchor="middle">Customer</text>

    <!-- Attribute ovals -->
    <ellipse class="attr" cx="190" cy="60" rx="80" ry="22"/>
    <text class="attr-text pk" x="190" y="64" text-anchor="middle">CustomerID (PK)</text>

    <ellipse class="attr" cx="10" cy="140" rx="70" ry="20"/>
    <text class="attr-text" x="10" y="144" text-anchor="middle">CustomerName</text>

    <!-- Connectors to attributes -->
    <line class="connector" x1="190" y1="95" x2="190" y2="82"/>
    <line class="connector" x1="120" y1="140" x2="70" y2="140"/>
  </g>

  <!-- CUSTOMERPHONE (below customer) -->
  <g id="customerphone">
    <rect class="entity" x="60" y="240" width="260" height="90" rx="10" ry="10"/>
    <text class="entity-title" x="190" y="275" text-anchor="middle">CustomerPhone</text>

    <ellipse class="attr" cx="190" cy="320" rx="78" ry="20"/>
    <text class="attr-text" x="190" y="324" text-anchor="middle">PhoneNumber (PK)</text>
  </g>

  <!-- ORDERS (center) -->
  <g id="orders">
    <rect class="entity" x="470" y="110" width="300" height="140" rx="10" ry="10"/>
    <text class="entity-title" x="620" y="150" text-anchor="middle">Orders</text>

    <ellipse class="attr" cx="620" cy="80" rx="92" ry="22"/>
    <text class="attr-text pk" x="620" y="84" text-anchor="middle">OrderID (PK)</text>

    <ellipse class="attr" cx="520" cy="170" rx="66" ry="18"/>
    <text class="attr-text" x="520" y="174" text-anchor="middle">OrderDate</text>

    <ellipse class="attr" cx="720" cy="170" rx="66" ry="18"/>
    <text class="attr-text" x="720" y="174" text-anchor="middle">TotalAmount</text>
  </g>

  <!-- ORDERFOOD (junction below Orders) -->
  <g id="orderfood">
    <rect class="entity" x="470" y="300" width="300" height="88" rx="10" ry="10"/>
    <text class="entity-title" x="620" y="335" text-anchor="middle">OrderFood</text>

    <ellipse class="attr" cx="540" cy="360" rx="72" ry="18"/>
    <text class="attr-text" x="540" y="364" text-anchor="middle">OrderID (FK, PK)</text>

    <ellipse class="attr" cx="700" cy="360" rx="72" ry="18"/>
    <text class="attr-text" x="700" y="364" text-anchor="middle">FoodID (FK, PK)</text>

    <ellipse class="attr" cx="620" cy="395" rx="60" ry="16"/>
    <text class="attr-text" x="620" y="399" text-anchor="middle">Quantity</text>
  </g>

  <!-- FOOD (right) -->
  <g id="food">
    <rect class="entity" x="980" y="280" width="260" height="120" rx="10" ry="10"/>
    <text class="entity-title" x="1110" y="315" text-anchor="middle">Food</text>

    <ellipse class="attr" cx="1110" cy="250" rx="82" ry="20"/>
    <text class="attr-text pk" x="1110" y="254" text-anchor="middle">FoodID (PK)</text>

    <ellipse class="attr" cx="900" cy="320" rx="70" ry="18"/>
    <text class="attr-text" x="900" y="324" text-anchor="middle">FoodName</text>

    <ellipse class="attr" cx="1110" cy="350" rx="76" ry="18"/>
    <text class="attr-text" x="1110" y="354" text-anchor="middle">Price</text>
  </g>

  <!-- RESTAURANT (top-right) -->
  <g id="restaurant">
    <rect class="entity" x="980" y="80" width="260" height="110" rx="10" ry="10"/>
    <text class="entity-title" x="1110" y="115" text-anchor="middle">Restaurant</text>

    <ellipse class="attr" cx="1110" cy="46" rx="84" ry="20"/>
    <text class="attr-text pk" x="1110" y="50" text-anchor="middle">RestaurantID (PK)</text>

    <ellipse class="attr" cx="830" cy="120" rx="70" ry="18"/>
    <text class="attr-text" x="830" y="124" text-anchor="middle">Location</text>
  </g>

  <!-- RIDER (right-lower) -->
  <g id="rider">
    <rect class="entity" x="980" y="430" width="260" height="110" rx="10" ry="10"/>
    <text class="entity-title" x="1110" y="465" text-anchor="middle">Rider</text>

    <ellipse class="attr" cx="1110" cy="400" rx="74" ry="18"/>
    <text class="attr-text pk" x="1110" y="404" text-anchor="middle">RiderID (PK)</text>

    <ellipse class="attr" cx="900" cy="470" rx="64" ry="16"/>
    <text class="attr-text" x="900" y="474" text-anchor="middle">VehicleType</text>
  </g>

  <!-- PAYMENT (right of Orders) -->
  <g id="payment">
    <rect class="entity" x="760" y="50" width="200" height="90" rx="10" ry="10"/>
    <text class="entity-title" x="860" y="90" text-anchor="middle">Payment</text>

    <ellipse class="attr" cx="860" cy="34" rx="64" ry="16"/>
    <text class="attr-text pk" x="860" y="38" text-anchor="middle">PaymentID (PK)</text>

    <ellipse class="attr" cx="860" cy="120" rx="70" ry="16"/>
    <text class="attr-text" x="860" y="124" text-anchor="middle">Amount</text>
  </g>

  <!-- RELATIONSHIPS (diamonds) -->
  <!-- Customer - Orders (places) -->
  <g id="rel_customer_orders">
    <polygon class="rel" points="335,160 365,140 395,160 365,180" />
    <text class="rel-text" x="365" y="162" text-anchor="middle">places</text>
    <line class="connector" x1="320" y1="155" x2="335" y2="155"/>
    <line class="connector" x1="395" y1="155" x2="470" y2="155"/>
    <text class="card" x="290" y="140">1</text>
    <text class="card" x="440" y="140">M</text>
  </g>

  <!-- Customer - CustomerPhone (has) -->
  <g id="rel_customer_phone">
    <polygon class="rel" points="160,235 185,215 210,235 185,255" />
    <text class="rel-text" x="185" y="236" text-anchor="middle">has</text>
    <line class="connector" x1="190" y1="210" x2="185" y2="215"/>
    <line class="connector" x1="210" y1="235" x2="190" y2="260"/>
    <text class="card" x="130" y="220">1</text>
    <text class="card" x="130" y="290">M</text>
  </g>

  <!-- Orders - Restaurant (fulfills) -->
  <g id="rel_orders_restaurant">
    <polygon class="rel" points="780,100 810,80 840,100 810,120" />
    <text class="rel-text" x="810" y="104" text-anchor="middle">fulfills</text>
    <line class="connector" x1="770" y1="165" x2="780" y2="120"/>
    <line class="connector" x1="980" y1="120" x2="840" y2="100"/>
    <text class="card" x="740" y="88">1</text>
    <text class="card" x="920" y="88">M</text>
  </g>

  <!-- Orders - Rider (delivers) -->
  <g id="rel_orders_rider">
    <polygon class="rel" points="820,300 850,280 880,300 850,320" />
    <text class="rel-text" x="850" y="303" text-anchor="middle">delivers</text>
    <line class="connector" x1="720" y1="230" x2="820" y2="300"/>
    <line class="connector" x1="880" y1="300" x2="980" y2="480"/>
    <text class="card" x="760" y="285">1</text>
    <text class="card" x="940" y="350">M</text>
  </g>

  <!-- Orders - OrderFood (contains via junction) -->
  <g id="rel_orders_orderfood">
    <polygon class="rel" points="620,240 650,220 680,240 650,260" />
    <text class="rel-text" x="650" y="243" text-anchor="middle">contains</text>
    <line class="connector" x1="620" y1="260" x2="620" y2="300"/>
    <line class="connector" x1="680" y1="240" x2="680" y2="300"/>
    <text class="card" x="600" y="220">1</text>
    <text class="card" x="700" y="220">M</text>
  </g>

  <!-- OrderFood - Food (junction to Food) -->
  <g id="rel_orderfood_food">
    <polygon class="rel" points="860,320 890,300 920,320 890,340" />
    <text class="rel-text" x="890" y="323" text-anchor="middle">references</text>
    <line class="connector" x1="800" y1="340" x2="860" y2="320"/>
    <line class="connector" x1="920" y1="320" x2="980" y2="340"/>
    <text class="card" x="820" y="300">M</text>
    <text class="card" x="940" y="320">1</text>
  </g>

  <!-- Orders - Payment (paid by) -->
  <g id="rel_orders_payment">
    <polygon class="rel" points="720,80 750,60 780,80 750,100" />
    <text class="rel-text" x="750" y="84" text-anchor="middle">paid by</text>
    <line class="connector" x1="620" y1="120" x2="720" y2="80"/>
    <line class="connector" x1="780" y1="80" x2="830" y2="110"/>
    <text class="card" x="700" y="60">1</text>
    <text class="card" x="820" y="60">1</text>
  </g>

  <!-- Legend -->
  <rect x="1040" y="30" width="320" height="140" rx="10" ry="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="1060" y="56" class="note">Legend</text>
  <text x="1060" y="80" class="note">Rectangle = Entity</text>
  <text x="1060" y="100" class="note">Oval = Attribute</text>
  <text x="1060" y="120" class="note">Diamond = Relationship</text>
  <text x="1060" y="140" class="note">PK = Primary Key, FK = Foreign Key</text>
</svg>
